# Support desk stack for local testing: API, demo_server, Postgres (pgvector), Redis,
# RabbitMQ, Phoenix, Prometheus and Grafana. No reverse proxy yet: every port binds to
# 127.0.0.1 only, so nothing is reachable from other machines.
#
# Secrets come from .env (copy .env.example). Compose also reads .env to fill the ${...}
# values below; .dockerignore keeps it out of the image.
#
#   docker compose up --build
#   docker compose down -v      # delete every volume (threads, orders, traces, metrics)

# The API image installs 10xgraph and 10xgraph-api from the sibling checkouts (see Dockerfile).
x-api-build: &api-build
  context: .
  additional_contexts:
    core: ../agentflow
    api: ../agentflow-api

# Inside the Docker network the services use their service names, not the localhost URLs in
# .env (those are for scripts and evals run on the host).
x-api-environment: &api-environment
  MODE: production
  LOG_FORMAT: json
  DATABASE_URL: postgresql://tenxgraph:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tenxgraph
  REDIS_URL: redis://redis:6379/0
  BROKER_URL: amqp://tenxgraph:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
  DEMO_MCP_URL: http://demo-server:8100/mcp/
  PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
  # Metrics only ("metrics" in 10xgraph.json; Prometheus accepts no traces). AI traces go to
  # Phoenix. OTEL_ENABLED is the older path that also sends request traces over gRPC to
  # OTEL_EXPORTER_OTLP_ENDPOINT, so it stays off and that variable stays empty.
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
  OTEL_EXPORTER_OTLP_ENDPOINT: ''
  OTEL_ENABLED: 'false'

# Read-only filesystem, no Linux capabilities, no setuid escalation.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  api:
    build: *api-build
    image: support-desk-api:latest
    pull_policy: build
    env_file:
      - .env
    environment: *api-environment
    # ORIGINS and ALLOWED_HOST come from .env. Production refuses to start while either is
    # missing or a wildcard.
    ports:
      - '127.0.0.1:8000:8000'
    command: [ 'gunicorn', '-k', 'tenxgraph_api.src.app.uvicorn_worker.TenxGraphUvicornWorker', '-b', '0.0.0.0:8000', '--graceful-timeout', '600', '--timeout', '660', '--no-control-socket', 'tenxgraph_api.src.app.main:app' ]
    stop_grace_period: 660s
    restart: unless-stopped
    <<: *hardening
    volumes:
      - uploads:/app/uploads
    depends_on:
      seed:
        condition: service_completed_successfully
      demo-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      phoenix:
        condition: service_started
      prometheus:
        condition: service_started

  # Loads the knowledge base for every company, then exits. The API waits for it.
  seed:
    build: *api-build
    image: support-desk-api:latest
    pull_policy: build
    env_file:
      - .env
    environment: *api-environment
    command: [ 'python', 'deploy/scripts/seed_knowledge_base.py' ]
    restart: 'no'
    <<: *hardening
    depends_on:
      postgres:
        condition: service_healthy

  # Background tasks (worker/tasks.py, "worker" in 10xgraph.json): TaskIQ over RabbitMQ, status
  # and results in Redis. The image has no 10xgraph CLI (the Dockerfile strips it), so these run
  # the TaskIQ commands that `10xgraph worker` and `10xgraph scheduler` run.
  worker:
    build: *api-build
    image: support-desk-api:latest
    pull_policy: build
    env_file:
      - .env
    environment:
      <<: *api-environment
      GRAPH_PATH: /app/10xgraph.json
    command: [ 'taskiq', 'worker', 'tenxgraph_api.jobs.worker:broker', 'worker.tasks' ]
    # The image's health check pings the API port, which a worker does not open.
    healthcheck:
      disable: true
    stop_grace_period: 60s
    restart: unless-stopped
    <<: *hardening
    depends_on:
      seed:
        condition: service_completed_successfully
      demo-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Sends the scheduled tasks (schedule= labels, e.g. nightly_cleanup). Run exactly one, or each
  # schedule fires once per scheduler.
  scheduler:
    build: *api-build
    image: support-desk-api:latest
    pull_policy: build
    env_file:
      - .env
    environment:
      <<: *api-environment
      GRAPH_PATH: /app/10xgraph.json
    command: [ 'taskiq', 'scheduler', 'tenxgraph_api.jobs.scheduler:scheduler', 'worker.tasks', '--update-interval', '10' ]
    healthcheck:
      disable: true
    restart: unless-stopped
    <<: *hardening
    deploy:
      replicas: 1
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # The companies' orders, refunds and tickets (schema "demo"); REST for staff, MCP for the agent.
  demo-server:
    build: ./demo_server
    image: support-desk-demo-server:latest
    pull_policy: build
    environment:
      DATABASE_URL: postgresql://tenxgraph:${POSTGRES_PASSWORD}@postgres:5432/tenxgraph
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - '127.0.0.1:8100:8100'
    restart: unless-stopped
    <<: *hardening
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tenxgraph
      POSTGRES_DB: tenxgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U tenxgraph -d tenxgraph' ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4
    command: [ 'redis-server', '--appendonly', 'yes' ]
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Graph events go to exchange "tenxgraph.events"; queue "tenxgraph.events.demo" keeps a copy
  # to look at in the management UI. Background tasks use the same broker.
  rabbitmq:
    image: rabbitmq:4.1-management
    configs:
      - source: rabbitmq-conf
        target: /etc/rabbitmq/conf.d/20-definitions.conf
      - source: rabbitmq-definitions
        target: /etc/rabbitmq/definitions.json
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ 'CMD', 'rabbitmq-diagnostics', '-q', 'ping' ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # AI traces, project "support-desk".
  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      # Phoenix turns login on by itself when it listens on all addresses (it must, for the API
      # container to reach it), and then rejects the API's traces with 401. Off for local
      # testing; the port is bound to 127.0.0.1. With login on, create a system API key in
      # Phoenix and set PHOENIX_API_KEY for the API instead.
      PHOENIX_ENABLE_AUTH: 'false'
    ports:
      - '127.0.0.1:6006:6006'
    volumes:
      - phoenix-data:/mnt/data
    restart: unless-stopped

  # The API pushes metrics over OTLP; there are no scrape jobs.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/10xgraph-dashboard.json:/var/lib/grafana/dashboards/10xgraph.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Browse the tables (threads, knowledge base, schema "demo"). The server is pre-registered;
  # pgAdmin asks for POSTGRES_PASSWORD on first connect.
  pgadmin:
    image: dpage/pgadmin4:9.4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
    ports:
      - '127.0.0.1:5050:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "support-desk",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "tenxgraph",
            "Username": "tenxgraph",
            "SSLMode": "prefer"
          }
        }
      }
  rabbitmq-conf:
    file: ./deploy/rabbitmq/rabbitmq.conf
  # Inline so the password stays in .env. Loading definitions replaces the default guest user.
  rabbitmq-definitions:
    content: |
      {
        "users": [
          {"name": "tenxgraph", "password": "${RABBITMQ_PASSWORD}", "tags": ["administrator"]}
        ],
        "vhosts": [{"name": "/"}],
        "permissions": [
          {"user": "tenxgraph", "vhost": "/", "configure": ".*", "write": ".*", "read": ".*"}
        ],
        "exchanges": [
          {"name": "tenxgraph.events", "vhost": "/", "type": "topic", "durable": true,
           "auto_delete": false, "internal": false, "arguments": {}}
        ],
        "queues": [
          {"name": "tenxgraph.events.demo", "vhost": "/", "durable": true, "auto_delete": false,
           "arguments": {"x-queue-type": "classic", "x-max-length": 10000}}
        ],
        "bindings": [
          {"source": "tenxgraph.events", "vhost": "/", "destination": "tenxgraph.events.demo",
           "destination_type": "queue", "routing_key": "#", "arguments": {}}
        ]
      }

volumes:
  uploads:
  postgres-data:
  redis-data:
  rabbitmq-data:
  phoenix-data:
  prometheus-data:
  grafana-data:
  pgadmin-data:
